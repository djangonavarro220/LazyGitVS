name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-package-dogfood:
    name: Test, package, and dogfood
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Release consistency check
        run: npm run check:release

      - name: Canonical upstream parity ledger
        run: npm run check:parity-ledger

      - name: Unit and integration tests
        run: npm test

      - name: Package VSIX
        run: npm run package:dist

      - name: Targeted rich-preview dogfood diagnostic
        id: preview_dogfood
        continue-on-error: true
        run: npm run dogfood:ui:preview-tabs

      - name: Install native screenshot dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: UI dogfood diagnostic
        id: ui_dogfood
        continue-on-error: true
        shell: bash
        run: timeout --foreground -k 10s 180s npm run dogfood:ui
        env:
          LGVS_DOGFOOD_THEME: Default Light Modern

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: lazygitvs-vsix
          path: dist/*.vsix
          if-no-files-found: error

      - name: Upload dogfood diagnostic evidence
        if: always() && (steps.preview_dogfood.outcome == 'failure' || steps.ui_dogfood.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: dogfood-output
          path: dogfood-output/
          if-no-files-found: ignore
